version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flipper
      POSTGRES_PASSWORD: flipper_pass
      POSTGRES_DB: flipper_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://flipper:flipper_pass@db:5432/flipper_ai
      REDIS_URL: redis://redis:6379/0

  worker:
    build: .
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://flipper:flipper_pass@db:5432/flipper_ai
      REDIS_URL: redis://redis:6379/0

  beat:
    build: .
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://flipper:flipper_pass@db:5432/flipper_ai
      REDIS_URL: redis://redis:6379/0

volumes:
  pgdata:
